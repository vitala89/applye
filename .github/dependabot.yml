# Dependency updates. Grouped and monthly on purpose: a solo-maintained repo drowns
# in a weekly per-package firehose, and a grouped PR is reviewable in one sitting.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    # Angular majors are a migration, not a bump, and Dependabot cannot tell the
    # difference. Its Angular 22 PR raised eighteen packages at once and could
    # not compile: Angular 22 requires TypeScript 6.0.x, which lives in another
    # group and stayed at 5.9. Landing an Angular major means `ng update` with
    # its migrations, in the right order (Nx first - @nx/angular caps the
    # Angular version it accepts), which is deliberate work rather than a review.
    #
    # Patches and minors still come through, so security fixes are not blocked.
    # To take a major: delete the matching entry here, or run the upgrade by hand
    # and let the next cycle catch up.
    #
    # `typescript` is on the list for a different reason: two separate constraints
    # refuse a major, so no amount of retrying helps. Angular 21's compiler wants
    # `~5.9`, and `typescript-eslint` 8 declares `>=4.8.4 <6.1.0`. A TypeScript
    # major therefore fails before a single task runs - nx cannot build the
    # project graph - which is what took down two grouped dev-tooling PRs and
    # then a third that proposed it alone. Both constraints have to move first.
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@schematics/angular'
        update-types: ['version-update:semver-major']
      - dependency-name: 'angular-eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      angular:
        patterns:
          - '@angular*'
      nx:
        patterns:
          - '@nx*'
          - 'nx'
      tauri:
        patterns:
          - '@tauri-apps*'
      dev-tooling:
        dependency-type: development
        patterns:
          - '*'
      production:
        dependency-type: production
        patterns:
          - '*'

  - package-ecosystem: cargo
    directory: '/apps/desktop/src-tauri'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      rust:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns:
          - '*'
