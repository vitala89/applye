name: CI

# Strict gate: runs on every push to main and on every pull request.
# Frontend goes through Nx affected (lint -> test -> build); the Rust/Tauri
# backend gets clippy + unit tests. Source-size and attribution checks prevent
# monolithic-file regressions and agent/co-author credit in repository history.
# Any failure blocks merge.
#
# Also here: the marketing site deploys to Cloudflare Pages, but only after the
# gate above has passed on a push to main.
#
# NOT here: the multi-OS Tauri release/packaging build - that is a separate
# tag-triggered workflow in Phase 4.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint / Test / Build (affected) + Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust (cargo) build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: nrwl/nx-set-shas@v5

      - name: Enforce code-size and attribution guardrails
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          npm run quality:file-size -- --base "$QUALITY_BASE"
          npm run quality:attribution -- --base "$QUALITY_BASE" --pr-body-env PR_BODY

      - name: Nx affected (lint, test, build)
        run: npx nx affected -t lint test build

      - name: Build desktop frontend
        run: npx nx build desktop

      - name: Verify the build is CSP-compatible
        run: npm run verify:csp

      - name: Clippy (Rust)
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Cargo test (Rust)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  deploy-web:
    name: Deploy applye.dev (Cloudflare Pages)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://applye.dev
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build site
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: npm run web:build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist/apps/web/browser
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'applye' }}
            --branch=main
