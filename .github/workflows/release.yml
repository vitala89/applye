name: Release

# Multi-OS packaging + auto-updater artifacts. Separate from ci.yml (which
# gates pushes/PRs). This runs ONLY on a version tag push (e.g. v0.18.0) and
# produces a DRAFT GitHub Release with installers + latest.json for review
# before publishing. The tag must match package.json, tauri.conf.json, and
# Cargo.toml versions.
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY           — updater private key (from `tauri signer generate`)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — its password (empty string if the key is passwordless)

on:
  push:
    tags:
      - 'v*'

# tauri-action needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust_target: ''
          - platform: windows-latest
            args: ''
            rust_target: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust (cargo) build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: npm ci

      - name: Verify release tag matches app versions
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          package_lock_version="$(node -p "require('./package-lock.json').version")"
          tauri_version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          cargo_version="$(grep -m1 '^version = ' apps/desktop/src-tauri/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vX.Y.Z format. Got: $GITHUB_REF_NAME"
            exit 1
          fi

          if [ "$package_version" != "$expected" ] || [ "$package_lock_version" != "$expected" ] || [ "$tauri_version" != "$expected" ] || [ "$cargo_version" != "$expected" ]; then
            echo "Tag/version mismatch:"
            echo "  tag:               $GITHUB_REF_NAME"
            echo "  package.json:      $package_version"
            echo "  package-lock.json: $package_lock_version"
            echo "  tauri.conf:        $tauri_version"
            echo "  Cargo.toml:        $cargo_version"
            exit 1
          fi

      - name: Build + publish draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing keys for the updater artifacts. Never hardcode — these come
          # from GitHub repo secrets. Password may be an empty string.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Applye ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your OS below. This release was generated automatically.'
          releaseDraft: true
          prerelease: false
          # Generate + attach latest.json so the in-app updater can find it.
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
