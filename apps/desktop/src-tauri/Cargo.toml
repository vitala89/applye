[package]
name = "applye-desktop"
version = "0.26.0"
description = "Applye — local-first AI-powered job search desktop app"
authors = ["Vitalii Kasap"]
license = "MIT"
repository = "https://github.com/vitala89/applye"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
docx-rs = "0.4"
# Post-process the docx-rs output zip to embed fonts (docx-rs has no font-embed
# API). Pinned to 0.6 to reuse the copy docx-rs already compiles.
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# `embedded_images` pulls printpdf's bundled `image` crate (0.24) and the
# `image_crate` re-export used to decode the CV photo for PDF embedding.
printpdf = { version = "0.7", features = ["embedded_images"] }
# Read glyph advances from the embedded CV fonts so PDF line-wrapping matches
# the real font metrics instead of a per-family char-width guess. printpdf 0.7
# embeds the TTF but does not expose per-glyph widths to callers.
ttf-parser = "0.25"
# Import tracklist (Phase 6.4): XLSX parsing, read-only. CSV/JSON/text are
# forwarded as raw text — the import-tracklist skill does structure
# detection on the text directly, no Rust-side CSV parsing needed.
calamine = "0.35"
# CV import (Documents 1b, ROADMAP §16.3): PDF text extraction, read-only.
# docx-rs (already a dependency, used for export) also reads .docx.
pdf-extract = "0.7"
# Auto-updater. Registered behind #[cfg(desktop)] in lib.rs; kept in the plain
# [dependencies] table so tauri-build picks up its capability permissions.
tauri-plugin-updater = "2"
base64 = "0.22"

# OS keychain — one backend per platform (no unused dbus on macOS/Windows).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Silent WYSIWYG print-to-PDF (commands/print.rs): drives WKWebView's print
# operation to a file. Same objc2 generation wry already compiles.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSGeometry", "NSDictionary", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation", "NSWindow", "NSResponder", "NSView"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "objc2-app-kit"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
