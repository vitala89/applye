[package]
name = "applye-desktop"
version = "0.16.0"
description = "Applye — local-first AI-powered job search desktop app"
authors = ["Vitalii Kasap"]
license = "MIT"
repository = "https://github.com/vkasap/applye"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
docx-rs = "0.4"
printpdf = "0.7"
# Import tracklist (Phase 6.4): XLSX parsing, read-only. CSV/JSON/text are
# forwarded as raw text — the import-tracklist skill does structure
# detection on the text directly, no Rust-side CSV parsing needed.
calamine = "0.35"
# Auto-updater. Registered behind #[cfg(desktop)] in lib.rs; kept in the plain
# [dependencies] table so tauri-build picks up its capability permissions.
tauri-plugin-updater = "2"

# OS keychain — one backend per platform (no unused dbus on macOS/Windows).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
