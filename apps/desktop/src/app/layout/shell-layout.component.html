<div class="shell" [attr.data-theme]="theme()">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar__logo">
      <span class="logo-text">Applye</span>
    </div>

    <nav class="sidebar__nav">
      <a class="nav-item" routerLink="/dashboard" routerLinkActive="nav-item--active">
        <span class="nav-item__icon" aria-hidden="true">⬛</span>
        <span class="nav-item__label">{{ t()('nav.dashboard') }}</span>
      </a>
      <a class="nav-item" routerLink="/profile" routerLinkActive="nav-item--active">
        <span class="nav-item__icon" aria-hidden="true">👤</span>
        <span class="nav-item__label">{{ t()('nav.profile') }}</span>
      </a>
      <a class="nav-item" routerLink="/jobs" routerLinkActive="nav-item--active">
        <span class="nav-item__icon" aria-hidden="true">🔍</span>
        <span class="nav-item__label">{{ t()('nav.jobs') }}</span>
      </a>
      <a class="nav-item" routerLink="/pipeline" routerLinkActive="nav-item--active">
        <span class="nav-item__icon" aria-hidden="true">📋</span>
        <span class="nav-item__label">{{ t()('nav.pipeline') }}</span>
      </a>
      <a class="nav-item" routerLink="/interview-prep" routerLinkActive="nav-item--active">
        <span class="nav-item__icon" aria-hidden="true">🎯</span>
        <span class="nav-item__label">{{ t()('nav.interview_prep') }}</span>
      </a>
      <a class="nav-item" routerLink="/documents" routerLinkActive="nav-item--active">
        <span class="nav-item__icon" aria-hidden="true">📄</span>
        <span class="nav-item__label">{{ t()('nav.documents') }}</span>
      </a>
      <a class="nav-item" routerLink="/settings" routerLinkActive="nav-item--active">
        <span class="nav-item__icon" aria-hidden="true">⚙</span>
        <span class="nav-item__label">{{ t()('nav.settings') }}</span>
      </a>
    </nav>

    <div class="sidebar__footer">
      <div class="ai-indicator">
        <span class="ai-indicator__dot"></span>
        <span class="ai-indicator__label">{{ t()('ai.indicator') }}</span>
        <span class="ai-indicator__mode">{{ t()('ai.mode_api') }}</span>
      </div>
    </div>
  </aside>

  <!-- Main area -->
  <div class="main">
    <!-- Topbar -->
    <header class="topbar">
      <h1 class="topbar__title" aria-live="polite">Applye</h1>

      <div class="topbar__actions">
        <button
          class="btn-theme"
          (click)="toggleTheme()"
          [attr.aria-label]="
            theme() === 'dark' ? t()('shell.theme_to_light') : t()('shell.theme_to_dark')
          "
        >
          {{ theme() === 'dark' ? '☀' : '🌙' }}
        </button>
        <button class="btn-primary" disabled [title]="t()('common.coming_soon')">
          {{ t()('actions.paste_job') }}
        </button>
      </div>
    </header>

    <!-- Page content -->
    <main class="content">
      <ng-content />
    </main>
  </div>
</div>
