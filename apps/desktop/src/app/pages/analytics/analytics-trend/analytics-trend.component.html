<div class="ana-trend">
  <div class="ana-trend__plot">
    <span class="ana-trend__ymax">{{ trend().yMax }}</span>
    <svg viewBox="0 0 100 42" preserveAspectRatio="none" class="ana-trend__svg" aria-hidden="true">
      <line
        x1="0"
        y1="3"
        x2="100"
        y2="3"
        stroke="var(--border-subtle)"
        stroke-width="1"
        vector-effect="non-scaling-stroke"
      />
      <line
        x1="0"
        y1="15"
        x2="100"
        y2="15"
        stroke="var(--border-subtle)"
        stroke-width="1"
        vector-effect="non-scaling-stroke"
        opacity="0.6"
      />
      <line
        x1="0"
        y1="27"
        x2="100"
        y2="27"
        stroke="var(--border-subtle)"
        stroke-width="1"
        vector-effect="non-scaling-stroke"
        opacity="0.6"
      />
      <line
        x1="0"
        y1="39"
        x2="100"
        y2="39"
        stroke="var(--border-subtle)"
        stroke-width="1"
        vector-effect="non-scaling-stroke"
      />
      <polygon [attr.points]="trend().area" fill="var(--accent)" opacity="0.07" />
      @if (trend().hasFollowups) {
        <polyline
          [attr.points]="trend().lineFollow"
          fill="none"
          stroke="var(--graphite-400)"
          stroke-width="1.3"
          vector-effect="non-scaling-stroke"
          opacity="0.55"
          stroke-linejoin="round"
        />
      }
      <polyline
        [attr.points]="trend().lineApps"
        fill="none"
        stroke="var(--accent)"
        stroke-width="1.7"
        vector-effect="non-scaling-stroke"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
    </svg>
  </div>
  <div class="ana-trend__ticks">
    @for (tk of trend().ticks; track $index) {
      <span>{{ tk }}</span>
    }
  </div>
  <ng-content />
</div>
