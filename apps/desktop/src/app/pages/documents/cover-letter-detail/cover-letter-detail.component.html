@if (loading()) {
  <p class="coverdetail__state">{{ t()('common.loading') }}</p>
} @else if (loadError() || !doc()) {
  <p class="coverdetail__state">{{ t()('common.error') }}</p>
} @else {
  <div class="coverdetail">
    <header class="coverdetail__bar">
      <button
        appButton
        variant="ghost"
        size="icon"
        type="button"
        (click)="back()"
        [attr.aria-label]="backLabel()"
        [title]="backLabel()"
      >
        <lucide-icon [img]="icons.back" [size]="16" aria-hidden="true" />
      </button>
      <input
        class="coverdetail__label"
        type="text"
        [ngModel]="label()"
        (ngModelChange)="label.set($event)"
        [placeholder]="t()('documents.cover_letter_untitled')"
      />
      <div class="coverdetail__spacer"></div>

      <!-- Word-count badge vs the selected length budget -->
      <span
        class="word-badge"
        [class.word-badge--under]="wordStatus() === 'under'"
        [class.word-badge--ok]="wordStatus() === 'ok'"
        [class.word-badge--over]="wordStatus() === 'over'"
        [title]="t()('documents.cover_letter_words')"
      >
        <span class="word-badge__dot"></span>
        {{ t()('documents.cover_letter_words') }}
        <strong>{{ wordCount() }}</strong>
      </span>

      <button
        appButton
        [variant]="previewMode() ? 'primary' : 'secondary'"
        size="sm"
        (click)="previewMode.set(!previewMode())"
      >
        <lucide-icon
          [img]="previewMode() ? icons.edit : icons.preview"
          [size]="14"
          aria-hidden="true"
        />
        {{ previewMode() ? t()('documents.cv_edit_action') : t()('documents.cv_preview_action') }}
      </button>

      @if (previewMode()) {
        <button appButton variant="primary" size="sm" (click)="exportPdfWysiwyg()">
          {{ t()('documents.cv_style_export_pdf_wysiwyg') }}
        </button>
      }

      <button
        appButton
        variant="secondary"
        size="sm"
        class="draft-accent"
        [disabled]="drafting() || regeneratingBlock() !== null"
        (click)="draftWithAI()"
      >
        <lucide-icon [img]="icons.draft" [size]="14" [class.spin]="drafting()" aria-hidden="true" />
        {{
          drafting()
            ? t()('documents.cover_letter_drafting')
            : t()('documents.cover_letter_draft_ai')
        }}
      </button>

      <button
        appButton
        variant="primary"
        size="sm"
        [disabled]="saving() || justSaved()"
        (click)="save()"
      >
        <lucide-icon
          [img]="justSaved() ? icons.check : icons.save"
          [size]="14"
          aria-hidden="true"
        />
        {{ justSaved() ? 'Saved' : saving() ? t()('common.loading') : t()('actions.save') }}
      </button>
    </header>

    <div class="coverdetail__body">
      <!-- EDIT MODE -->
      @if (!previewMode()) {
        <div class="coverdetail__editor-col">
          <!-- Region card: region + default toggle + tone/length -->
          <app-cover-letter-settings-card />

          <!-- Availability card: what a German posting asks the letter to state -->
          <app-cover-letter-availability-card />

          <!-- Style card: collapsible font/size/weight/colour/page/margins -->
          <app-cover-letter-style-card (allReset)="openStyleKey.set(null)" />

          <!-- Blocks -->
          <div class="coverdetail__blocks">
            <!-- Recipient address -->
            <app-cover-letter-recipient-block
              [open]="isBlockOpen('recipient')"
              [styleOpen]="openStyleKey() === 'recipient'"
              [customStyle]="hasCustomStyle('recipient')"
              [stylePopover]="stylePopover"
              (toggled)="toggleBlockCollapse('recipient')"
              (styleToggled)="toggleStylePopover($event)"
            />

            <!-- Date -->
            <app-cover-letter-block
              [key]="'date'"
              [value]="content().date"
              [open]="isBlockOpen('date')"
              [styleOpen]="openStyleKey() === 'date'"
              [customStyle]="hasCustomStyle('date')"
              [regenerating]="regeneratingBlock() === 'date'"
              [stylePopover]="stylePopover"
              [regeneratable]="false"
              (toggled)="toggleBlockCollapse('date')"
              (styleToggled)="toggleStylePopover('date')"
              (regenerated)="regenerateBlock('date')"
              (valueChanged)="updateField('date', $event)"
            />

            <!-- Subject -->
            <app-cover-letter-block
              [key]="'subject'"
              [value]="content().subject"
              [open]="isBlockOpen('subject')"
              [styleOpen]="openStyleKey() === 'subject'"
              [customStyle]="hasCustomStyle('subject')"
              [regenerating]="regeneratingBlock() === 'subject'"
              [stylePopover]="stylePopover"
              (toggled)="toggleBlockCollapse('subject')"
              (styleToggled)="toggleStylePopover('subject')"
              (regenerated)="regenerateBlock('subject')"
              (valueChanged)="updateField('subject', $event)"
            />

            <!-- Greeting -->
            <app-cover-letter-block
              [key]="'greeting'"
              [value]="content().greeting"
              [open]="isBlockOpen('greeting')"
              [styleOpen]="openStyleKey() === 'greeting'"
              [customStyle]="hasCustomStyle('greeting')"
              [regenerating]="regeneratingBlock() === 'greeting'"
              [stylePopover]="stylePopover"
              (toggled)="toggleBlockCollapse('greeting')"
              (styleToggled)="toggleStylePopover('greeting')"
              (regenerated)="regenerateBlock('greeting')"
              (valueChanged)="updateField('greeting', $event)"
            />

            <!-- Body paragraphs -->
            <app-cover-letter-body-paragraphs
              [open]="isBlockOpen('body')"
              [openStyleKey]="openStyleKey()"
              [regeneratingBlock]="regeneratingBlock()"
              [stylePopover]="stylePopover"
              (toggled)="toggleBlockCollapse('body')"
              (styleToggled)="toggleStylePopover($event)"
              (regenerated)="regenerateBlock('body', $event)"
              (paragraphRemoved)="removeParagraph($event)"
            />

            <!-- Closing -->
            <app-cover-letter-block
              [key]="'closing'"
              [value]="content().closing"
              [open]="isBlockOpen('closing')"
              [styleOpen]="openStyleKey() === 'closing'"
              [customStyle]="hasCustomStyle('closing')"
              [regenerating]="regeneratingBlock() === 'closing'"
              [stylePopover]="stylePopover"
              (toggled)="toggleBlockCollapse('closing')"
              (styleToggled)="toggleStylePopover('closing')"
              (regenerated)="regenerateBlock('closing')"
              (valueChanged)="updateField('closing', $event)"
            />

            <!-- Signature -->
            <app-cover-letter-block
              [key]="'signature'"
              [value]="content().signature"
              [open]="isBlockOpen('signature')"
              [styleOpen]="openStyleKey() === 'signature'"
              [customStyle]="hasCustomStyle('signature')"
              [regenerating]="regeneratingBlock() === 'signature'"
              [stylePopover]="stylePopover"
              (toggled)="toggleBlockCollapse('signature')"
              (styleToggled)="toggleStylePopover('signature')"
              (regenerated)="regenerateBlock('signature')"
              (valueChanged)="updateField('signature', $event)"
            />
          </div>
        </div>

        <!-- Per-block Style popover (font / size / colour / weight), parameterized by key -->
        <ng-template #stylePopover let-key>
          <app-cover-letter-style-popover [styleKey]="key" />
        </ng-template>
      } @else {
        <!-- PREVIEW MODE -->
        <div class="coverdetail__preview-col">
          <app-cover-letter-preview
            [content]="content()"
            [style]="style()"
            [language]="doc()?.language ?? 'en'"
          />
        </div>
      }
    </div>
  </div>
}
