<div class="docedit-card">
  <div class="docedit-meta">
    <span class="docedit-field__label">{{ t()('documents.cv_field_region') }}</span>
    <div class="docedit-meta-row">
      <select [ngModel]="regionTag()" (ngModelChange)="regionTag.set($event)">
        @for (r of regionTags; track r) {
          <option [value]="r">{{ r.toUpperCase() }}</option>
        }
      </select>
      <button
        type="button"
        class="coverdetail__checkbox"
        [class.coverdetail__checkbox--active]="isDefault()"
        [attr.aria-pressed]="isDefault()"
        (click)="isDefault.set(!isDefault())"
      >
        <span class="coverdetail__checkbox-box">
          @if (isDefault()) {
            <lucide-icon [img]="icons.check" [size]="11" aria-hidden="true" />
          }
        </span>
        {{ t()('documents.cv_field_is_default') }}
      </button>
    </div>
  </div>

  <div class="docedit-style-grid">
    <div class="docedit-field">
      <span class="docedit-field__label">{{ t()('documents.cover_letter_tone') }}</span>
      <select [ngModel]="tone()" (ngModelChange)="setTone($event)">
        @for (opt of toneOptions; track opt) {
          <option [value]="opt">
            {{ t()('documents.cover_letter_tone_' + opt.toLowerCase()) }}
          </option>
        }
      </select>
    </div>
    <div class="docedit-field">
      <span class="docedit-field__label">{{ t()('documents.cover_letter_length') }}</span>
      <select [ngModel]="length()" (ngModelChange)="setLength($event)">
        @for (opt of lengthOptions; track opt) {
          <option [value]="opt">
            {{ t()('documents.cover_letter_length_' + opt.toLowerCase()) }}
          </option>
        }
      </select>
    </div>
  </div>
</div>
