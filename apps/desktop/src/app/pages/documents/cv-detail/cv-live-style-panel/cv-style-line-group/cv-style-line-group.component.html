<div class="cvlive__group">
  <button
    type="button"
    class="cvlive__group-head"
    [attr.aria-expanded]="open()"
    (click)="toggled.emit()"
  >
    <span class="cvlive__label">{{ t()('documents.cv_style_line') }}</span>
    <lucide-icon
      class="cvlive__chevron"
      [class.cvlive__chevron--open]="open()"
      [img]="icons.chevron"
      [size]="16"
      aria-hidden="true"
    />
  </button>
  @if (open()) {
    <div class="cvlive__group-body">
      <label class="cvlive__field">
        <span class="cvlive__label">{{ t()('documents.cv_style_line') }}</span>
        <select [ngModel]="border()" (ngModelChange)="borderChange.emit($event)">
          @if (showInherit()) {
            <option value="">{{ t()('documents.cv_section_style_inherit') }}</option>
          }
          <option value="none">{{ t()('documents.cv_style_line_none') }}</option>
          <option value="solid">{{ t()('documents.cv_style_line_solid') }}</option>
          <option value="dotted">{{ t()('documents.cv_style_line_dotted') }}</option>
          <option value="dashed">{{ t()('documents.cv_style_line_dashed') }}</option>
        </select>
      </label>

      @if (showRule()) {
        <label class="cvlive__field">
          <span class="cvlive__label">{{ t()('documents.cv_style_rule_width') }}</span>
          <input
            type="number"
            min="0.5"
            max="6"
            step="0.5"
            [ngModel]="ruleWidth()"
            [placeholder]="t()('documents.cv_section_style_inherit')"
            (ngModelChange)="widthChange.emit($event)"
          />
        </label>

        <label class="cvlive__field">
          <span class="cvlive__label">{{ t()('documents.cv_style_rule_color') }}</span>
          <input type="color" [ngModel]="ruleColor()" (ngModelChange)="colorChange.emit($event)" />
        </label>
      }
    </div>
  }
</div>
