<div class="cvpreview-viewport" [ngStyle]="themeVars()">
  <lib-paginated-sheet
    [atoms]="atoms()"
    [geometry]="geometry()"
    [captionFn]="captionFn"
    (blockOverflow)="onBlockOverflow($event)"
  />
  @if (overflow()) {
    <p class="cvpreview__warning" role="status">
      {{ t()('documents.cv_style_overflow_warning') }}
    </p>
  }
</div>

<!-- Atom templates: preview fragments rendered once per atom by
     `<lib-paginated-sheet>` (measure pass + final page cards). Interactive
     click-to-select affordances are gated on `$sheetRenderMode === 'page'`
     (via `selectable()`), so the hidden measurement pass stays inert and
     geometry-identical - outline-only highlighting never changes box metrics.
     Selectable hosts carry role="button" + tabindex, an aria-label, and both
     Enter and Space activation (native-button parity); `data-cv-select` marks
     the host so a committing edit can return keyboard focus to it. -->
<!-- Every atom is a child component now, and every wrapper stays, because
     `<lib-paginated-sheet>` renders a TemplateRef and not a component: the
     wrapper is what forwards the outlet context to the child's inputs. What is
     left on this page is the sheet, the overflow warning and `#sectionTitleTpl`
     - one `<h3>`, which a component would have been all boilerplate around. -->
<ng-template
  #headerTpl
  let-section
  let-photoUri="photoUri"
  let-placement="placement"
  let-renderMode="$sheetRenderMode"
>
  <app-cv-preview-header
    [section]="section"
    [photoUri]="photoUri"
    [placement]="placement"
    [renderMode]="renderMode"
    [includeBirthdate]="includeBirthdate()"
    [includeMaritalStatus]="includeMaritalStatus()"
  />
</ng-template>

<ng-template #summaryTpl let-section let-renderMode="$sheetRenderMode">
  <app-cv-preview-summary [section]="section" [renderMode]="renderMode" />
</ng-template>

<ng-template #sectionTitleTpl let-label let-key="key" let-renderMode="$sheetRenderMode">
  <h3
    class="cvpreview__section-title cvpreview__section-start"
    [class.cvpreview__selectable]="selectable(renderMode)"
    [class.cvpreview__selected]="isSelected(key, 'title') && selectable(renderMode)"
    [attr.role]="selectable(renderMode) ? 'button' : null"
    [attr.tabindex]="selectable(renderMode) ? 0 : null"
    [attr.aria-label]="selectable(renderMode) ? selectAriaLabel(key, 'title') : null"
    [attr.data-cv-select]="key + ':title'"
    [attr.data-cv-chip]="partChipLabel('title')"
    (click)="selectPart(key, 'title', renderMode, $event)"
    (keydown.enter)="selectPart(key, 'title', renderMode, $event)"
    (keydown.space)="onSelectKey($event, key, 'title', renderMode)"
    [ngStyle]="css.titleCss(key)"
    [style.borderBottom]="css.titleBorderCss(key)"
  >
    {{ label }}
  </h3>
</ng-template>

<ng-template #skillsTpl let-section let-renderMode="$sheetRenderMode">
  <app-cv-preview-skills [section]="section" [renderMode]="renderMode" />
</ng-template>

<!-- An experience entry is split into a head atom + one atom per
     bullet so a long entry can flow across a page break (the head is
     glued to its first bullet; later bullets are free). See atoms(). -->
<ng-template
  #expHeadTpl
  let-entry
  let-key="key"
  let-first="first"
  let-i="i"
  let-section="section"
  let-renderMode="$sheetRenderMode"
>
  <app-cv-preview-exp-head
    [entry]="entry"
    [section]="section"
    [key]="key"
    [i]="i"
    [first]="first"
    [showIndustry]="activeTheme().entry.showIndustry"
    [renderMode]="renderMode"
  />
</ng-template>

<ng-template
  #expBulletTpl
  let-bullet
  let-key="key"
  let-i="i"
  let-b="b"
  let-section="section"
  let-renderMode="$sheetRenderMode"
>
  <app-cv-preview-exp-bullet
    [bullet]="bullet"
    [section]="section"
    [key]="key"
    [i]="i"
    [b]="b"
    [renderMode]="renderMode"
  />
</ng-template>

<ng-template
  #eduEntryTpl
  let-entry
  let-key="key"
  let-i="i"
  let-section="section"
  let-renderMode="$sheetRenderMode"
>
  <app-cv-preview-edu-entry
    [entry]="entry"
    [section]="section"
    [key]="key"
    [i]="i"
    [renderMode]="renderMode"
  />
</ng-template>

<ng-template #languagesTpl let-section let-renderMode="$sheetRenderMode">
  <app-cv-preview-languages [section]="section" [renderMode]="renderMode" />
</ng-template>
