<div
  class="modal-backdrop"
  (click)="cancelled.emit()"
  (keydown.escape)="cancelled.emit()"
  tabindex="-1"
  role="presentation"
>
  <div
    class="modal"
    role="presentation"
    tabindex="-1"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
  >
    <h3>{{ t()('documents.cv_save_as_template_title') }}</h3>
    <input
      type="text"
      [ngModel]="name()"
      (ngModelChange)="nameChange.emit($event)"
      [placeholder]="t()('documents.cv_field_template_name')"
    />
    <div class="modal__actions">
      <button class="btn-ghost" (click)="cancelled.emit()">{{ t()('actions.cancel') }}</button>
      <button
        class="btn-primary"
        [disabled]="saving() || !name().trim()"
        (click)="confirmed.emit()"
      >
        {{ saving() ? t()('common.loading') : t()('actions.save') }}
      </button>
    </div>
  </div>
</div>
