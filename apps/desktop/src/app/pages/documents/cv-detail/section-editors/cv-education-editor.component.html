@for (entry of section().entries; track $index; let ei = $index) {
  <div class="cvdetail__entry">
    <div class="cvdetail__grid">
      <input
        type="text"
        [ngModel]="entry.degree"
        (ngModelChange)="updateField(ei, 'degree', $event)"
        [placeholder]="t()('documents.cv_field_degree')"
      />
      <input
        type="text"
        [ngModel]="entry.institution"
        (ngModelChange)="updateField(ei, 'institution', $event)"
        [placeholder]="t()('documents.cv_field_institution')"
      />
      <input
        type="text"
        class="cvdetail__input-mono"
        [ngModel]="entry.startDate"
        (ngModelChange)="updateField(ei, 'startDate', $event)"
        [placeholder]="t()('documents.cv_field_start_date')"
      />
      <input
        type="text"
        class="cvdetail__input-mono"
        [ngModel]="entry.endDate"
        (ngModelChange)="updateField(ei, 'endDate', $event)"
        [placeholder]="t()('documents.cv_field_end_date')"
      />
    </div>
    <div class="cvdetail__entry-actions cvdetail__entry-actions--end">
      <button type="button" class="cvdetail__remove-btn" (click)="removeEntry(ei)">
        <lucide-icon [img]="icons.trash" [size]="12" aria-hidden="true" />
        {{ t()('documents.cv_remove_entry') }}
      </button>
    </div>
  </div>
}
<button type="button" class="cvdetail__add-btn" (click)="addEntry()">
  <lucide-icon [img]="icons.plus" [size]="13" aria-hidden="true" />
  {{ t()('documents.cv_add_education') }}
</button>
