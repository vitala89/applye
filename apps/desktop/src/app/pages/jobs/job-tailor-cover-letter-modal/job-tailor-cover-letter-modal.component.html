@if (tailor.modalOpen()) {
  <div
    class="modal-backdrop"
    (click)="tailor.modalOpen.set(false)"
    (keydown.escape)="tailor.modalOpen.set(false)"
    tabindex="-1"
    role="presentation"
  >
    <div
      class="modal"
      role="presentation"
      tabindex="-1"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    >
      <h3>{{ t()('documents.cover_letter_tailor_title') }}</h3>
      <p class="modal__hint">{{ t()('documents.cover_letter_tailor_hint') }}</p>

      <!-- `.cvform` is declared only in `cv-list.component.scss`, which Angular
           scopes to that component's own template, so it has never reached this
           markup. The inline styles below are what actually dresses these two
           fields; they moved here verbatim rather than being "fixed" inside an
           extraction, whose whole value is that behaviour did not change. -->
      <div class="cvform">
        <label
          style="
            grid-column: span 2;
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
            font-size: var(--text-xs);
            color: var(--text-tertiary);
            margin-bottom: var(--space-2);
          "
        >
          {{ t()('documents.cover_letter_tailor_select') }}
          <select
            style="
              background: var(--surface-sunken);
              border: var(--border-width) solid var(--border-default);
              border-radius: var(--radius-input);
              color: var(--text-primary);
              padding: var(--space-2) var(--space-3);
            "
            [ngModel]="tailor.selectedId()"
            (ngModelChange)="
              tailor.selectedId.set($event === null || $event === '' ? null : +$event)
            "
          >
            <option [ngValue]="null">
              {{ t()('documents.cover_letter_tailor_none') }}
            </option>
            @for (c of coverLetters(); track c.id) {
              <option [value]="c.id">
                {{ c.label || t()('documents.cover_letter_untitled') }} ({{
                  c.language?.toUpperCase()
                }})
              </option>
            }
          </select>
        </label>
        <label
          style="
            grid-column: span 2;
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
            font-size: var(--text-xs);
            color: var(--text-tertiary);
            margin-bottom: var(--space-2);
          "
        >
          {{ t()('documents.cv_field_language') }}
          <select
            style="
              background: var(--surface-sunken);
              border: var(--border-width) solid var(--border-default);
              border-radius: var(--radius-input);
              color: var(--text-primary);
              padding: var(--space-2) var(--space-3);
            "
            [ngModel]="tailor.language()"
            (ngModelChange)="tailor.language.set($event)"
          >
            @for (l of languages; track l) {
              <option [value]="l">{{ l.toUpperCase() }}</option>
            }
          </select>
        </label>
      </div>

      @if (tailor.error()) {
        <p class="modal__error">{{ tailor.error() }}</p>
      }
      <div class="modal__actions">
        <button
          class="btn btn--secondary btn--md"
          [disabled]="tailor.running()"
          (click)="tailor.modalOpen.set(false)"
        >
          {{ t()('actions.cancel') }}
        </button>
        <button
          class="btn btn--primary btn--md"
          [disabled]="tailor.running()"
          (click)="confirmed.emit()"
        >
          {{
            tailor.running()
              ? t()('documents.cover_letter_tailor_busy')
              : t()('documents.cover_letter_tailor_confirm_btn')
          }}
        </button>
      </div>
    </div>
  </div>
}
