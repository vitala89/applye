<div class="qv__followup-row">
  <select
    class="qv__lang-select"
    [ngModel]="followupLanguage()"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="onFollowupLanguageChange($event)"
  >
    @for (l of FOLLOWUP_LANGUAGES; track l) {
      <option [value]="l">{{ langName(l) }}</option>
    }
  </select>
  <button type="button" class="btn-ghost" [disabled]="followupDrafting()" (click)="draftFollowup()">
    <lucide-icon [img]="icons.mail" [size]="14" />
    {{ t()('followup.draft_action') }}
  </button>
</div>

@if (followupDrafting()) {
  <p class="qv__hint">{{ t()('common.loading') }}</p>
} @else if (followupError()) {
  <p class="qv__error">{{ followupError() }}</p>
} @else if (followupHasDraft()) {
  @if (followupFromCache()) {
    <p class="qv__hint">{{ t()('followup.cached_hint') }}</p>
  }
  <div class="qv__followup-row">
    <input
      class="qv__followup-recipient"
      [ngModel]="followupTo()"
      (ngModelChange)="followupTo.set($event)"
      [ngModelOptions]="{ standalone: true }"
      [placeholder]="t()('followup.to_placeholder')"
    />
    <input
      class="qv__followup-recipient"
      [ngModel]="followupCc()"
      (ngModelChange)="followupCc.set($event)"
      [ngModelOptions]="{ standalone: true }"
      [placeholder]="t()('followup.cc_placeholder')"
    />
  </div>
  <input
    class="qv__followup-subject"
    [ngModel]="followupSubject()"
    (ngModelChange)="followupSubject.set($event)"
    [ngModelOptions]="{ standalone: true }"
    [placeholder]="t()('followup.subject_placeholder')"
  />
  <textarea
    class="qv__followup-body"
    rows="6"
    [ngModel]="followupBody()"
    (ngModelChange)="followupBody.set($event)"
    [ngModelOptions]="{ standalone: true }"
  ></textarea>
  <div class="qv__followup-row">
    <button type="button" class="btn-ghost" (click)="copyFollowup()">
      <lucide-icon [img]="icons.copy" [size]="14" />
      {{ followupCopied() ? t()('followup.copied') : t()('followup.copy') }}
    </button>
    <button type="button" class="btn-primary" (click)="openFollowupInMail()">
      {{ t()('followup.open_in_mail') }}
    </button>
  </div>
} @else {
  <p class="qv__followup-note">{{ t()('followup.privacy_note') }}</p>
}
