<div class="collapse-card">
  <div
    class="collapse-card__head"
    role="button"
    tabindex="0"
    [attr.aria-expanded]="open()"
    (click)="toggled.emit()"
    (keydown.enter)="toggled.emit()"
    (keydown.space)="toggled.emit(); $event.preventDefault()"
  >
    <span class="collapse-card__title">{{ t()('profile.section_languages') }}</span>
    <span class="collapse-card__summary">
      {{
        entries().length
          ? t()('profile.summary_languages').replace('{count}', entries().length + '')
          : t()('profile.summary_empty')
      }}
    </span>
    <lucide-icon
      [img]="icons.chevron"
      [size]="17"
      class="chevron"
      [class.chevron--open]="open()"
      aria-hidden="true"
    />
  </div>
  @if (open()) {
    <div class="collapse-card__body">
      @if (entries().length > 0) {
        <div class="lang-list">
          @for (l of entries(); track $index) {
            <div class="lang-row">
              <input
                class="archetype-input"
                type="text"
                [ngModel]="l.language"
                (ngModelChange)="updateField($index, 'language', $event)"
                [placeholder]="t()('profile.lang_name')"
                [attr.aria-label]="t()('profile.lang_name')"
              />
              <select
                class="archetype-fit"
                [ngModel]="l.level"
                (ngModelChange)="updateField($index, 'level', $event)"
                [attr.aria-label]="t()('profile.lang_level')"
              >
                @for (lvl of levels; track lvl) {
                  <option [value]="lvl">
                    {{ lvl || t()('profile.lang_level_none') }}
                  </option>
                }
              </select>
              <button
                class="btn-ghost"
                type="button"
                (click)="remove($index)"
                [attr.aria-label]="t()('profile.remove_language')"
              >
                <lucide-icon [img]="icons.remove" [size]="15" aria-hidden="true" />
              </button>
            </div>
          }
        </div>
      }
      <button class="btn-dashed" type="button" (click)="add()">
        <lucide-icon [img]="icons.plus" [size]="14" aria-hidden="true" />
        {{ t()('profile.add_language') }}
      </button>
    </div>
  }
</div>
