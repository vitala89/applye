<div class="collapse-card">
  <div
    class="collapse-card__head"
    role="button"
    tabindex="0"
    [attr.aria-expanded]="open()"
    (click)="toggled.emit()"
    (keydown.enter)="toggled.emit()"
    (keydown.space)="toggled.emit(); $event.preventDefault()"
  >
    <span class="collapse-card__title">{{ t()('profile.section_skills') }}</span>
    <span class="collapse-card__summary">
      {{
        skills().length
          ? t()('profile.summary_skills').replace('{count}', skills().length + '')
          : t()('profile.summary_empty')
      }}
    </span>
    <lucide-icon
      [img]="icons.chevron"
      [size]="17"
      class="chevron"
      [class.chevron--open]="open()"
      aria-hidden="true"
    />
  </div>
  @if (open()) {
    <div class="collapse-card__body">
      <div class="chip-input">
        @for (s of skills(); track $index) {
          <span class="skill-chip">
            {{ s }}
            <button
              type="button"
              class="skill-chip__x"
              (click)="removeChip($index)"
              [attr.aria-label]="t()('profile.remove_skill')"
            >
              <lucide-icon [img]="icons.remove" [size]="12" aria-hidden="true" />
            </button>
          </span>
        }
        <!-- The id the completeness hero scrolls to when skills are missing.
             It belongs on the field itself, so it travels with this section. -->
        <input
          id="field-skills"
          class="chip-input__field"
          type="text"
          (keydown.enter)="addChip($event)"
          [placeholder]="t()('profile.skills_add_hint')"
          [attr.aria-label]="t()('profile.field_skills')"
        />
      </div>
    </div>
  }
</div>
