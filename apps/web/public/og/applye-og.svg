<!--
  Source for public/og/applye-og.png (the Open Graph card, 1200x630).

  The art lives in the vertical centre band of a 1200x1200 canvas because the
  macOS renderer used to export it fits by height; cropping the centre 630px
  back out yields the exact 1200x630 card. Regenerate with:

    cd apps/web/public/og
    qlmanage -t -s 1200 -o . applye-og.svg
    sips -c 630 1200 applye-og.svg.png (with the "out" flag) applye-og.png
    rm applye-og.svg.png

  The exact command lives in tools/generate-og.sh; a double hyphen cannot
  appear inside an XML comment, hence the paraphrase above.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="Applye: drafting is automated, submitting is not.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E0F13"/>
      <stop offset="1" stop-color="#15171E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="#0E0F13"/>

  <g transform="translate(0 285)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect x="0" y="0" width="1200" height="6" fill="#4F5BFF"/>

    <!-- Brand mark: the slash + bar from the app icon -->
    <g transform="translate(88 70) scale(1.1)">
      <polygon points="37,10 45,10 15,54 7,54" fill="#F5F6F8"/>
      <rect x="50" y="10" width="8" height="44" fill="#4F5BFF"/>
    </g>
    <text x="168" y="128" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="40" font-weight="600" fill="#F5F6F8">applye</text>

    <text x="88" y="270" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="62" font-weight="700" fill="#F5F6F8">Drafting is automated.</text>
    <text x="88" y="352" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="62" font-weight="700" fill="#4F5BFF">Submitting is not.</text>

    <text x="88" y="440" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" fill="#A6ABB8">Open-source, local-first desktop app for an AI-powered job search.</text>

    <text x="88" y="550" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#6E7484">Free · MIT · No account · No telemetry · applye.dev</text>
  </g>
</svg>
