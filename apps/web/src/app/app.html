<!-- ============================================================
     applye.dev landing
     Brand: monochrome graphite + indigo. JetBrains Mono headings,
     Inter body. Dark default, light toggle. All tokens from libs/ui.
     Tone: honest, anti-hype. Augmentation is the emotional core.
     ============================================================ -->
<a class="skip-link" href="#main">Skip to content</a>

<header class="nav">
  <div class="nav__inner shell">
    <a class="brand" routerLink="/" aria-label="applye home">
      <svg class="brand__mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <polygon points="37,10 45,10 15,54 7,54" fill="currentColor" />
        <rect x="50" y="10" width="8" height="44" fill="var(--indigo-600, #4F5BFF)" />
      </svg>
      applye<span class="brand__cursor" aria-hidden="true"></span>
    </a>

    <nav class="nav__links" aria-label="Primary">
      <a routerLink="/methodology" routerLinkActive="is-active">Methodology</a>
      <a routerLink="/docs" routerLinkActive="is-active">Docs</a>
      <a routerLink="/changelog" routerLinkActive="is-active">Changelog</a>
      <a class="nav__soon" routerLink="/blog" routerLinkActive="is-active" data-soon="Soon">Blog</a>
    </nav>

    <div class="nav__actions">
      <button
        type="button"
        class="icon-btn"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        @if (theme() === 'dark') {
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
          />
        </svg>
        } @else {
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        }
      </button>
      <app-source-link
        class="nav__source"
        variant="ghost"
        [icon]="true"
        label="View source"
        soonLabel="Source: soon"
      />
    </div>
  </div>
</header>

<main id="main">
  <router-outlet></router-outlet>
</main>

<footer class="footer">
  <div class="shell footer__inner">
    <div class="footer__brand">
      <span class="brand">
        <svg class="brand__mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <polygon points="37,10 45,10 15,54 7,54" fill="currentColor" />
          <rect x="50" y="10" width="8" height="44" fill="var(--indigo-600, #4F5BFF)" />
        </svg>
        applye<span class="brand__cursor" aria-hidden="true"></span>
      </span>
      <p>Drafting is automated. Submitting is not.</p>
    </div>
    <nav class="footer__links" aria-label="Footer">
      <a routerLink="/docs">Docs</a>
      <a routerLink="/manifesto">Manifesto</a>
      <a routerLink="/methodology">Methodology</a>
      <a routerLink="/compare">Compare</a>
      <a routerLink="/blog">Blog</a>
      <a routerLink="/changelog">Changelog</a>
      <a routerLink="/press">Press</a>
      <a routerLink="/privacy">Privacy</a>
      <a routerLink="/sustain">Sustain</a>
    </nav>
    <div class="footer__social" aria-label="Social links">
      <app-source-link [icon]="true" label="GitHub" soonLabel="Source: soon" />
      @if (discord) {
      <a
        class="icon-btn"
        [href]="discord"
        target="_blank"
        rel="noopener"
        aria-label="Applye community on Discord"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path
            d="M20.32 4.37a19.8 19.8 0 0 0-4.93-1.51 13.8 13.8 0 0 0-.64 1.28 18.3 18.3 0 0 0-5.5 0 13.8 13.8 0 0 0-.64-1.28 19.8 19.8 0 0 0-4.94 1.51C.53 9.05-.32 13.58.1 18.06a19.9 19.9 0 0 0 6.07 3.06 14.7 14.7 0 0 0 1.26-2.05 12.9 12.9 0 0 1-2-.96l.49-.37a14.2 14.2 0 0 0 12.16 0l.49.37a12.9 12.9 0 0 1-2 .96 14.7 14.7 0 0 0 1.26 2.05 19.9 19.9 0 0 0 6.07-3.06c.5-5.18-.84-9.67-3.58-13.69ZM8.02 15.33c-1.18 0-2.16-1.08-2.16-2.42s.95-2.42 2.16-2.42c1.21 0 2.18 1.09 2.16 2.42 0 1.34-.95 2.42-2.16 2.42Zm7.96 0c-1.18 0-2.16-1.08-2.16-2.42s.95-2.42 2.16-2.42c1.21 0 2.18 1.09 2.16 2.42 0 1.34-.95 2.42-2.16 2.42Z"
          />
        </svg>
      </a>
      } @if (linkedin) {
      <a
        class="icon-btn"
        [href]="linkedin"
        target="_blank"
        rel="noopener"
        aria-label="Vitalii Kasap on LinkedIn"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path
            d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05a3.74 3.74 0 0 1 3.37-1.85c3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.72v20.55C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.72C24 .77 23.2 0 22.22 0Z"
          />
        </svg>
      </a>
      } @if (xTwitter) {
      <a class="icon-btn" [href]="xTwitter" target="_blank" rel="noopener" aria-label="Applye on X">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path
            d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.41l-5.8-7.58-6.64 7.58H.47l8.6-9.83L0 1.15h7.6l5.24 6.93 6.06-6.93Zm-1.29 19.5h2.04L6.49 3.24H4.3l13.31 17.41Z"
          />
        </svg>
      </a>
      }
    </div>
  </div>
  <div class="shell footer__legal">
    <span>MIT licensed · © {{ year }} Applye</span>
    <span>Built by <a [href]="author" target="_blank" rel="noopener">Vitalii Kasap</a></span>
  </div>
</footer>
