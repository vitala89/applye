<!-- ============================================================
     applye.dev landing
     Brand: monochrome graphite + indigo. JetBrains Mono headings,
     Inter body. Dark default, light toggle. All tokens from libs/ui.
     Tone: honest, anti-hype. Augmentation is the emotional core.
     ============================================================ -->
<a class="skip-link" href="#main">Skip to content</a>

<header class="nav">
  <div class="nav__inner shell">
    <a class="brand" routerLink="/" aria-label="applye home">
      <svg class="brand__mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <polygon points="37,10 45,10 15,54 7,54" fill="currentColor" />
        <rect x="50" y="10" width="8" height="44" fill="var(--indigo-600, #4F5BFF)" />
      </svg>
      applye<span class="brand__cursor" aria-hidden="true"></span>
    </a>

    <nav class="nav__links" aria-label="Primary">
      <a routerLink="/docs" routerLinkActive="is-active">Docs</a>
      <a class="nav__soon" routerLink="/blog" routerLinkActive="is-active" data-soon="Soon">Blog</a>
    </nav>

    <div class="nav__actions">
      <button
        type="button"
        class="icon-btn"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        @if (theme() === 'dark') {
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
          />
        </svg>
        } @else {
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        }
      </button>
      <a class="btn btn--ghost nav__source" [href]="repo" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path
            d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.36-3.88-1.36-.53-1.34-1.3-1.7-1.3-1.7-1.06-.72.08-.71.08-.71 1.17.08 1.79 1.2 1.79 1.2 1.04 1.79 2.73 1.27 3.4.97.1-.76.41-1.27.74-1.56-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.69 5.41-5.25 5.69.42.37.8 1.09.8 2.2v3.26c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5z"
          />
        </svg>
        View source
      </a>
    </div>
  </div>
</header>

<main id="main">
  <router-outlet></router-outlet>
</main>

<footer class="footer">
  <div class="shell footer__inner">
    <div class="footer__brand">
      <span class="brand">
        <svg class="brand__mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <polygon points="37,10 45,10 15,54 7,54" fill="currentColor" />
          <rect x="50" y="10" width="8" height="44" fill="var(--indigo-600, #4F5BFF)" />
        </svg>
        applye<span class="brand__cursor" aria-hidden="true"></span>
      </span>
      <p>Drafting is automated. Submitting is not.</p>
    </div>
    <nav class="footer__links" aria-label="Footer">
      <a [href]="repo" target="_blank" rel="noopener">GitHub</a>
      <a routerLink="/docs">Docs</a>
      <a routerLink="/blog">Blog</a>
      <a [href]="dataContract" target="_blank" rel="noopener">Privacy</a>
    </nav>
  </div>
  <div class="shell footer__legal">
    <span>MIT licensed · © {{ year }} Applye</span>
    <span>Built by <a [href]="author" target="_blank" rel="noopener">Vitalii Kasap</a></span>
  </div>
</footer>
