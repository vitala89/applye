<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Applye: Drafting is automated. Submitting is not.</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Applye is a free, open-source, local-first desktop app for an AI-powered job search. Blunt recruiter checks, tailored CVs, a pipeline kanban. Your data, your machine, your AI. MIT licensed."
    />
    <meta name="theme-color" content="#0E0F13" />

    <!-- Social / Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Applye: Drafting is automated. Submitting is not." />
    <meta
      property="og:description"
      content="Open-source, local-first desktop app for an AI-powered job search. Your data, your machine, your AI. Free, MIT licensed."
    />
    <meta property="og:url" content="https://applye.dev" />
    <meta property="og:site_name" content="Applye" />
    <meta property="og:locale" content="en" />
    <meta property="og:image" content="https://applye.dev/og/applye-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Applye - drafting is automated, submitting is not." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://applye.dev/og/applye-og.png" />

    <!-- Structured data. Kept static so it survives with or without JS. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Applye",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Job search",
        "operatingSystem": "macOS, Windows, Linux",
        "url": "https://applye.dev",
        "description": "Free, open-source, local-first desktop app for an AI-powered job search. Blunt recruiter checks, tailored CVs, and a pipeline kanban, with all data kept on your own machine.",
        "license": "https://opensource.org/licenses/MIT",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR"
        },
        "author": {
          "@type": "Person",
          "name": "Vitalii Kasap",
          "url": "https://vitaliikasap.com"
        }
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="brand/applye-favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="canonical" href="https://applye.dev" />

    <!-- No-FOUC theme bootstrap: apply the stored theme before first paint. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('applye-theme');
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
